schema_version: "1"
metadata:
  title: Failed search activity
  description: Identify failed search activity from the Splunk Audit Logs CIM data
    model.
  category: detection
  status: experimental
  version: 1
  author: querysplunk contributors
  severity: medium
  tags:
  - audit
  - search
  - failure
  - cim
  id: querysplunk.detection.failed-search-activity
requirements:
  platforms:
  - splunk-cloud
  - splunk-enterprise
  apps:
  - Splunk_SA_CIM
  data_models:
  - Splunk_Audit.Search_Activity
  fields:
  - user
  - search
  - info
  - action
provenance:
  source: querysplunk
  source_url: https://github.com/georgestarcher/querysplunk
  source_rule_ids: []
  license: MIT
interpretation:
  summary: Rows summarize failed searches by user and audited search context.
  false_positives:
  - Syntax mistakes, expired knowledge objects, or temporary service conditions can
    produce benign failures.
  recommended_actions:
  - Review repeated failures, affected users, search content sensitivity, and surrounding
    audit activity.

app: search
output_file: detection-failed-search-activity.json
mode: job
search: |
  | tstats summariesonly=false fillnull_value="unknown"
      count AS failure_count,
      min(_time) AS first_seen_epoch,
      max(_time) AS last_seen_epoch
      FROM datamodel=Splunk_Audit.Search_Activity
      WHERE Search_Activity.info="failed"
      BY Search_Activity.user, Search_Activity.host, Search_Activity.search_type, Search_Activity.source, Search_Activity.sourcetype, Search_Activity.search
  | rename Search_Activity.* AS *
  | sort 0 -last_seen_epoch
  | head 200
  | table first_seen_epoch, last_seen_epoch, failure_count, user, host, search_type, source, sourcetype, search
dispatch:
  earliest_time: "-24h"
  latest_time: "now"
results:
  endpoint: auto
  output_mode: json
  count: 0
  offset: 0
diagnostics:
  search_log: summary
