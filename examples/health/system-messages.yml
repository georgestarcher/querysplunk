schema_version: "1"
metadata:
  title: System messages
  description: List current Splunk system messages through the read-only messages
    endpoint.
  category: health
  status: stable
  version: 1
  author: querysplunk contributors
  severity: medium
  tags:
  - messages
  - rest
  - health
  id: querysplunk.health.system-messages
requirements:
  platforms:
  - splunk-cloud
  - splunk-enterprise
  fields:
  - title
  - severity
  - message
  - timeCreated_epochSecs
provenance:
  source: querysplunk
  source_url: https://github.com/georgestarcher/querysplunk
  source_rule_ids: []
  license: MIT
interpretation:
  summary: Rows list current system messages that may require administrative attention.
  false_positives:
  - Acknowledged or already remediated messages can remain until Splunk clears them.
  recommended_actions:
  - Review severity and creation time, remediate active conditions, and clear messages
    only through an authorized workflow.

result_handling:
  classification: internal
  contains_credentials: false
  agent_display: bounded_summary
  recommended_file_mode: "0600"
  retention: temporary
result_contract:
  required_fields:
  - title
  - message
  - severity
  - server
  - timeCreated_iso
  allow_empty: true
  maximum_rows: 200

app: search
output_file: system-messages.json
mode: job
search: |
  | rest /services/messages count=100 strict=true splunk_server=local
  | table title, message, severity, server, timeCreated_iso
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
