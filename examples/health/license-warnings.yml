schema_version: "1"
metadata:
  title: License warnings
  description: Find recent license-related warnings in Splunk internal logs.
  category: health
  status: stable
  version: 1
  author: querysplunk contributors
  severity: high
  tags:
  - license
  - internal
  - capacity
  id: querysplunk.health.license-warnings
requirements:
  platforms:
  - splunk-cloud
  - splunk-enterprise
  indexes:
  - _internal
  fields:
  - component
  - message
provenance:
  source: querysplunk
  source_url: https://github.com/georgestarcher/querysplunk
  source_rule_ids: []
  license: MIT
interpretation:
  summary: Rows identify recent license warnings that may affect ingestion or search
    behavior.
  false_positives:
  - Resolved historical warnings can remain visible within the selected time range.
  recommended_actions:
  - Check current license usage and pool status, then resolve sustained quota or entitlement
    problems.

result_handling:
  classification: internal
  contains_credentials: false
  agent_display: bounded_summary
  recommended_file_mode: "0600"
  retention: temporary
result_contract:
  required_fields: []
  allow_empty: true
  maximum_rows: 200

app: search
output_file: license-warnings.json
mode: job
search: |
  search index=_internal earliest=-24h (component=LicenseUsage OR component=LicenseManager)
  | stats count, min(_time) AS first_seen_epoch, max(_time) AS last_seen_epoch, latest(_raw) AS latest_message BY host, component, log_level
  | sort - count
dispatch:
  earliest_time: "-24h"
  latest_time: "now"
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
