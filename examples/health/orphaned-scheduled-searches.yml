schema_version: "1"
metadata:
  title: Orphaned scheduled searches
  description: List scheduled searches whose owning user can no longer be resolved.
  category: health
  status: stable
  version: 1
  author: querysplunk contributors
  severity: medium
  tags:
  - saved-search
  - scheduler
  - ownership
  - rest
  id: querysplunk.health.orphaned-scheduled-searches
requirements:
  platforms:
  - splunk-cloud
  - splunk-enterprise
  fields:
  - title
  - app
  - owner
  - orphan
  - is_scheduled
provenance:
  source: querysplunk
  source_url: https://github.com/georgestarcher/querysplunk
  source_rule_ids: []
  license: MIT
interpretation:
  summary: Rows identify enabled scheduled searches that Splunk marks as orphaned.
  false_positives:
  - Intentional service-account migration can briefly leave searches orphaned.
  recommended_actions:
  - Assign an appropriate active owner or disable the schedule after confirming business
    purpose and app context.

result_handling:
  classification: internal
  contains_credentials: false
  agent_display: bounded_summary
  recommended_file_mode: "0600"
  retention: temporary
result_contract:
  required_fields:
  - title
  - app
  - owner
  - orphan
  - disabled
  - is_scheduled
  - cron_schedule
  - alert_type
  - actions
  - next_scheduled_time
  allow_empty: true
  maximum_rows: 200

app: search
output_file: orphaned-scheduled-searches.json
mode: job
search: |
  | rest /servicesNS/-/-/saved/searches add_orphan_field=true search="orphan=1" search="is_scheduled=1" count=100 strict=true splunk_server=local
  | rename eai:acl.app AS app eai:acl.owner AS owner
  | where orphan=1 AND is_scheduled=1
  | table title, app, owner, orphan, disabled, is_scheduled, cron_schedule, alert_type, actions, next_scheduled_time
  | sort 0 app title
  | head 200
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
