app: search
output_file: detection-sensitive-search-activity.json
mode: job
search: |
  | tstats summariesonly=false fillnull_value="unknown"
      count AS event_count,
      min(_time) AS first_seen_epoch,
      max(_time) AS last_seen_epoch
      FROM datamodel=Splunk_Audit.Search_Activity
      BY Search_Activity.user, Search_Activity.host, Search_Activity.info, Search_Activity.search_type, Search_Activity.search
  | rename Search_Activity.* AS *
  | eval normalized_search=lower(search)
  | eval activity=case(
      match(normalized_search, "\|\s*rest\s+/(?:services/storage/passwords|servicesns/[^/\s]+/[^/\s]+/storage/passwords)"), "credential_store_access",
      match(normalized_search, "\|\s*delete\b"), "event_deletion",
      match(normalized_search, "\|\s*(?:collect|outputlookup)\b"), "data_write",
      match(normalized_search, "\|\s*(?:sendemail|script)\b"), "external_action",
      match(normalized_search, "\|\s*map\b"), "dynamic_search_execution",
      match(normalized_search, "\|\s*rest\b"), "rest_api_access",
      true(), "other")
  | where activity!="other"
  | sort 0 -last_seen_epoch
  | head 200
  | table first_seen_epoch, last_seen_epoch, event_count, activity, user, host, info, search_type, search
dispatch:
  earliest_time: "-24h"
  latest_time: "now"
results:
  endpoint: auto
  output_mode: json
  count: 0
  offset: 0
diagnostics:
  search_log: summary
