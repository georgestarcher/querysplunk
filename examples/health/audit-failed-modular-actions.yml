schema_version: "1"
metadata:
  title: Failed modular actions
  description: Summarize failed modular actions through the Splunk Audit Logs CIM
    data model.
  category: health
  status: stable
  version: 1
  author: querysplunk contributors
  severity: medium
  tags:
  - audit
  - modular-action
  - failure
  - cim
  id: querysplunk.health.audit-failed-modular-actions
requirements:
  platforms:
  - splunk-cloud
  - splunk-enterprise
  apps:
  - Splunk_SA_CIM
  data_models:
  - Splunk_Audit.Modular_Actions
  fields:
  - action_name
  - app
  - user
  - status
provenance:
  source: querysplunk
  source_url: https://github.com/georgestarcher/querysplunk
  source_rule_ids: []
  license: MIT
interpretation:
  summary: Rows summarize modular-action failures that can affect alerts and downstream
    integrations.
  false_positives:
  - Expected test actions or brief downstream outages can create isolated failures.
  recommended_actions:
  - Inspect the affected action configuration, destination health, permissions, and
    subsequent successful executions.

app: search
output_file: audit-failed-modular-actions.json
mode: job
search: |
  | tstats summariesonly=false fillnull_value="unknown"
      count AS failure_count,
      min(_time) AS first_seen_epoch,
      max(_time) AS last_seen_epoch,
      avg(Modular_Actions.duration) AS average_duration_ms,
      max(Modular_Actions.duration) AS maximum_duration_ms
      FROM datamodel=Splunk_Audit.Modular_Actions
      WHERE Modular_Actions.action_status IN ("failure", "error")
      BY Modular_Actions.app, Modular_Actions.action_name, Modular_Actions.action_mode, Modular_Actions.action_status, Modular_Actions.search_name, Modular_Actions.user, Modular_Actions.component, Modular_Actions.signature
  | rename Modular_Actions.* AS *
  | eval average_duration_ms=round(average_duration_ms, 2)
  | sort 0 -last_seen_epoch
  | head 200
  | table first_seen_epoch, last_seen_epoch, failure_count, app, action_name, action_mode, action_status, search_name, user, component, signature, average_duration_ms, maximum_duration_ms
dispatch:
  earliest_time: "-24h"
  latest_time: "now"
results:
  endpoint: auto
  output_mode: json
  count: 0
  offset: 0
diagnostics:
  search_log: summary
