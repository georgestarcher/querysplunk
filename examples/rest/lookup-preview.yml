schema_version: "1"
metadata:
  title: Bounded lookup preview
  description: Preview a finite number of rows from a named Splunk lookup.
  category: rest
  status: stable
  version: 1
  author: querysplunk contributors
  severity: low
  tags:
  - lookup
  - preview
  - bounded-output
  id: querysplunk.rest.lookup-preview
requirements:
  platforms:
  - splunk-cloud
  - splunk-enterprise
  fields:
  - lookup row fields
provenance:
  source: querysplunk
  source_url: https://github.com/georgestarcher/querysplunk
  source_rule_ids: []
  license: MIT
interpretation:
  summary: Rows provide a bounded preview of the configured lookup.
  false_positives:
  - Sampled rows may not represent every value or condition in a large lookup.
  recommended_actions:
  - Confirm the lookup name and app context, then expand the row bound only when the
    additional exposure is justified.

result_handling:
  classification: internal
  contains_credentials: false
  agent_display: bounded_summary
  recommended_file_mode: "0600"
  retention: temporary
result_contract:
  required_fields: []
  allow_empty: true
  maximum_rows: 200

app: search
output_file: lookup-preview.json
mode: job
search: |
  | inputlookup max=100 example_lookup
  | head 100
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
