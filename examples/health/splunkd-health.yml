schema_version: "1"
metadata:
  title: Splunkd health
  description: Retrieve a concise summary of Splunkd health indicators.
  category: health
  status: stable
  version: 1
  author: querysplunk contributors
  severity: medium
  tags:
  - splunkd
  - health
  - summary
  id: querysplunk.health.splunkd-health
requirements:
  platforms:
  - splunk-cloud
  - splunk-enterprise
  fields:
  - name
  - status
  - message
provenance:
  source: querysplunk
  source_url: https://github.com/georgestarcher/querysplunk
  source_rule_ids: []
  license: MIT
interpretation:
  summary: Rows provide a concise view of current Splunkd health.
  false_positives:
  - Transient warnings can clear before they produce operational impact.
  recommended_actions:
  - Expand non-green indicators with the detailed health search and verify the affected
    subsystem.

app: search
output_file: splunkd-health.json
mode: job
search: |
  | rest /services/server/health/splunkd
  | table title, health, status, message
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
