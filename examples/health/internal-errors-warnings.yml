app: search
output_file: internal-errors-warnings.json
mode: job
search: |
  search index=_internal earliest=-1h (log_level=error OR log_level=warn*)
  | stats count, min(_time) AS first_seen_epoch, max(_time) AS last_seen_epoch, latest(_raw) AS latest_message BY host, source, sourcetype, log_level, component
  | sort - count
dispatch:
  earliest_time: "-1h"
  latest_time: "now"
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
