schema_version: "1"
metadata:
  title: Disk partition health
  description: Report Splunk health indicators for monitored disk partitions.
  category: health
  status: stable
  version: 1
  author: querysplunk contributors
  severity: high
  tags:
  - disk
  - capacity
  - health
  id: querysplunk.health.disk-partitions
requirements:
  platforms:
  - splunk-cloud
  - splunk-enterprise
  fields:
  - name
  - status
  - message
provenance:
  source: querysplunk
  source_url: https://github.com/georgestarcher/querysplunk
  source_rule_ids: []
  license: MIT
interpretation:
  summary: Rows report disk-related health indicators exposed by Splunk.
  false_positives:
  - Short-lived capacity spikes can clear before intervention.
  recommended_actions:
  - Verify current filesystem capacity and growth, then address sustained warning
    or critical states.

result_handling:
  classification: internal
  contains_credentials: false
  agent_display: bounded_summary
  recommended_file_mode: "0600"
  retention: temporary
result_contract:
  required_fields:
  - title
  - mount_point
  - available
  - capacity
  - free
  - total
  - used
  allow_empty: true
  maximum_rows: 200

app: search
output_file: disk-partitions.json
mode: job
search: |
  | rest /services/server/status/partitions-space
  | table title, mount_point, available, capacity, free, total, used
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
