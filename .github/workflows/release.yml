name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label to use for a dry-run artifact build"
        required: true
        default: "v0.0.0-dryrun"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: true

      - name: Test
        run: |
          go test ./...
          (cd splunk && go test ./...)

      - name: Build release assets
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          case "${VERSION}" in
            v*) ;;
            *) echo "version must start with v, got ${VERSION}"; exit 1 ;;
          esac

          rm -rf build dist
          mkdir -p build dist

          build() {
            local goos="$1"
            local goarch="$2"
            local ext="${3:-}"
            local name="splunkquery-${VERSION}-${goos}-${goarch}"
            local output="build/${name}${ext}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags="-s -w" -o "${output}" .
            if [ "${goos}" = "windows" ]; then
              zip -j "dist/${name}.zip" "${output}"
            else
              tar -C build -czf "dist/${name}.tar.gz" "${name}"
            fi
          }

          build darwin amd64
          build darwin arm64
          build linux amd64
          build linux arm64
          build windows amd64 .exe

          (cd dist && sha256sum * > checksums.txt)

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
