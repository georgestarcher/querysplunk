app: Splunk_ML_Toolkit
output_file: recent-search-job-failures.json
mode: job
search: |
  search index=_internal source=*scheduler.log (success=0 OR status="failed")
  | eval scheduler_message=coalesce(errmsg, reason, "No scheduler message reported")
  | where match(sid, "^[A-Za-z0-9_.-]+$")
  | join type=inner sid [
      | rest /services/search/jobs splunk_server=local strict=true count=500
      | where isDone=1
      | fields sid
    ]
  | sort 0 - _time
  | dedup app savedsearch_name scheduler_message
  | head 10
  | fields sid
  | map maxsearches=10 search="| rest /services/search/jobs/$sid$/search.log splunk_server=local strict=true | eval sid=\"$sid$\" | stats list(value) AS log_parts BY sid | eval log_text=mvjoin(log_parts, \"\\n\") | rex mode=sed field=log_text \"s/(?i)(authorization:[ ]*bearer|bearer|token|password|secret)[=: ]+[^ ,;\\r\\n]+/\\1=[REDACTED]/g\" | eval log_length=len(log_text) | eval log_text=if(log_length>24000,\"...[earlier search.log text omitted]...\\n\" . substr(log_text, log_length-23999, 24000),log_text) | eval _raw=log_text | addinfo"
  | join type=left sid [
      search index=_internal source=*scheduler.log (success=0 OR status="failed") sid=*
      | eval scheduler_message=coalesce(errmsg, reason, "No scheduler message reported")
      | stats latest(_time) AS failure_epoch latest(app) AS app latest(savedsearch_name) AS savedsearch_name latest(scheduler_message) AS errmsg latest(run_time) AS runtime_seconds BY sid
    ]
  | eval failure_time=strftime(failure_epoch, "%Y-%m-%d %H:%M:%S %Z")
  | eval log_text=coalesce(log_text, errmsg)
  | ai prompt="Analyze the search.log for the unsuccessful Splunk scheduled search named {savedsearch_name} in app {app}. Identify the primary failure cause and cite the supporting components and messages. Distinguish the root cause from secondary warnings or cleanup activity. Recommend specific remediation and validation steps. If the evidence is insufficient, say so without inventing details. Scheduler message: {errmsg}. Search log: {log_text}"
  | eval throttle_key=sha256(app . "::" . savedsearch_name . "::" . coalesce(errmsg, ""))
  | table failure_time app savedsearch_name sid runtime_seconds errmsg ai_result_1 throttle_key
  | sort 0 app savedsearch_name
dispatch:
  earliest_time: "-24h"
  latest_time: "now"
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
