schema_version: "1"
metadata:
  title: Splunkd health details
  description: Retrieve detailed Splunkd health indicators for troubleshooting.
  category: health
  status: stable
  version: 1
  author: querysplunk contributors
  severity: medium
  tags:
  - splunkd
  - health
  - diagnostics
  id: querysplunk.health.splunkd-health-details
requirements:
  platforms:
  - splunk-cloud
  - splunk-enterprise
  fields:
  - name
  - status
  - message
provenance:
  source: querysplunk
  source_url: https://github.com/georgestarcher/querysplunk
  source_rule_ids: []
  license: MIT
interpretation:
  summary: Rows provide detailed component-level Splunkd health information.
  false_positives:
  - Recently recovered conditions can remain visible until health indicators refresh.
  recommended_actions:
  - Focus on non-green indicators, correlate related components, and follow the reported
    remediation guidance.

result_handling:
  classification: internal
  contains_credentials: false
  agent_display: bounded_summary
  recommended_file_mode: "0600"
  retention: temporary
result_contract:
  required_fields:
  - title
  - feature
  - health
  - status
  - message
  - root_cause
  allow_empty: true
  maximum_rows: 200

app: search
output_file: splunkd-health-details.json
mode: job
search: |
  | rest /services/server/health/splunkd/details
  | table title, feature, health, status, message, root_cause
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
