schema_version: "1"
metadata:
  title: Sensitive search activity
  description: Identify audited searches that reference potentially sensitive Splunk
    objects or commands.
  category: detection
  status: experimental
  version: 1
  author: querysplunk contributors
  severity: high
  tags:
  - audit
  - search
  - sensitive-data
  - cim
  id: querysplunk.detection.sensitive-search-activity
requirements:
  platforms:
  - splunk-cloud
  - splunk-enterprise
  apps:
  - Splunk_SA_CIM
  data_models:
  - Splunk_Audit.Search_Activity
  fields:
  - user
  - search
  - action
  - info
provenance:
  source: querysplunk
  source_url: https://github.com/georgestarcher/querysplunk
  source_rule_ids: []
  license: MIT
interpretation:
  summary: Rows highlight audited search activity that may expose credentials, configuration,
    or other sensitive data.
  false_positives:
  - Authorized administrators and security testers may intentionally inspect sensitive
    objects.
  recommended_actions:
  - Confirm the user's authorization, the search purpose, and whether sensitive results
    were exported or shared.

result_handling:
  classification: sensitive
  contains_credentials: false
  agent_display: summary_only
  recommended_file_mode: "0600"
  retention: temporary
result_contract:
  required_fields:
  - first_seen_epoch
  - last_seen_epoch
  - event_count
  - activity
  - user
  - host
  - info
  - search_type
  - search
  allow_empty: true
  maximum_rows: 200

app: search
output_file: detection-sensitive-search-activity.json
mode: job
search: |
  | tstats summariesonly=false fillnull_value="unknown"
      count AS event_count,
      min(_time) AS first_seen_epoch,
      max(_time) AS last_seen_epoch
      FROM datamodel=Splunk_Audit.Search_Activity
      BY Search_Activity.user, Search_Activity.host, Search_Activity.info, Search_Activity.search_type, Search_Activity.search
  | rename Search_Activity.* AS *
  | eval normalized_search=lower(search)
  | eval activity=case(
      match(normalized_search, "\|\s*rest\s+/(?:services/storage/passwords|servicesns/[^/\s]+/[^/\s]+/storage/passwords)"), "credential_store_access",
      match(normalized_search, "\|\s*delete\b"), "event_deletion",
      match(normalized_search, "\|\s*(?:collect|outputlookup)\b"), "data_write",
      match(normalized_search, "\|\s*(?:sendemail|script)\b"), "external_action",
      match(normalized_search, "\|\s*map\b"), "dynamic_search_execution",
      match(normalized_search, "\|\s*rest\b"), "rest_api_access",
      true(), "other")
  | where activity!="other"
  | sort 0 -last_seen_epoch
  | head 200
  | table first_seen_epoch, last_seen_epoch, event_count, activity, user, host, info, search_type, search
dispatch:
  earliest_time: "-24h"
  latest_time: "now"
results:
  endpoint: auto
  output_mode: json
  count: 0
  offset: 0
diagnostics:
  search_log: summary
