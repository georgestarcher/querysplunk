schema_version: "1"
metadata:
  title: Resource usage
  description: Summarize recent Splunk resource-usage telemetry.
  category: health
  status: stable
  version: 1
  author: querysplunk contributors
  severity: medium
  tags:
  - resource-usage
  - performance
  - capacity
  id: querysplunk.health.resource-usage
requirements:
  platforms:
  - splunk-cloud
  - splunk-enterprise
  indexes:
  - _internal
  fields:
  - host
  - process
  - cpu_seconds
  - mem_used
provenance:
  source: querysplunk
  source_url: https://github.com/georgestarcher/querysplunk
  source_rule_ids: []
  license: MIT
interpretation:
  summary: Rows summarize recent host and process resource consumption reported by
    Splunk.
  false_positives:
  - Expected maintenance or high-volume workloads can produce temporary utilization
    peaks.
  recommended_actions:
  - Compare sustained outliers with workload schedules, host capacity, and concurrent
    search activity.

result_handling:
  classification: internal
  contains_credentials: false
  agent_display: bounded_summary
  recommended_file_mode: "0600"
  retention: temporary
result_contract:
  required_fields:
  - title
  - process_type
  - instance
  allow_empty: true
  maximum_rows: 200

app: search
output_file: resource-usage.json
mode: job
search: |
  | rest /services/server/status/resource-usage
  | table title, cpu_*, mem_*, process_type, instance
  | head 200
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
