name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label to use for a dry-run artifact build"
        required: true
        default: "v0.0.0-dryrun"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release assets
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          case "${VERSION}" in
            v*) ;;
            *) echo "version must start with v, got ${VERSION}"; exit 1 ;;
          esac

          scripts/package-release.sh "${VERSION}" splunkquery dist

      - name: Verify release archive contents
        run: scripts/verify-package-contents.sh dist

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
