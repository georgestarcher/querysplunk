# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
# Integration workflow note:
# - Normal CI on push/pull_request runs unit, race, fuzz, lint, tidy, and vuln checks.
# - Live Splunk integration tests run only via manual workflow_dispatch with run_integration_tests=true.
# Required GitHub environment secrets for integration.
# Configure these in the AUTH_TOKEN environment:
#   - SPLUNKBASEURL
#   - SPLUNKTOKEN
#   - SPLUNKUSERNAME
# Optional GitHub environment secrets for integration:
#   - SPLUNKPASSWORD
#   - SPLUNKTLSVERIFY
#   - SPLUNKTIMEOUT
#   - SPLUNKAPP
#   - SPLUNK_INTEGRATION_QUERY (optional; defaults to: search index=_internal | head 1)

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: "Run live Splunk integration tests (requires secrets)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.5'
        check-latest: true
        cache: true

    - name: Check gofmt
      run: |
        FILES="$(gofmt -l .)"
        if [ -n "${FILES}" ]; then
          echo "The following files are not gofmt'd:"
          echo "${FILES}"
          exit 1
        fi

    - name: Build
      run: go build -v ./...

    - name: Test with coverage
      run: go test -v -coverprofile=coverage.out ./...

    - name: Report splunk package coverage
      run: go tool cover -func=coverage.out

    - name: Test with race detector
      run: go test -race -v ./...

    - name: Test POSIX installer
      run: scripts/test-install.sh

    - name: Test documentation, help, examples, and skill
      run: scripts/test-docs.sh

    - name: Fuzz search log parser
      run: go test ./splunk -run '^$' -fuzz '^FuzzAnalyzeJobLog$' -fuzztime 5s

    - name: Vet
      run: go vet ./...

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Check module tidy
      run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum

    - name: Vulnerability check (govulncheck)
      run: govulncheck ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          check-latest: true
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0

  platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          check-latest: true
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test POSIX installer
        if: runner.os == 'macOS'
        run: scripts/test-install.sh

      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1

      - name: Test with race detector
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Document Windows race exclusion
        if: runner.os == 'Windows'
        run: echo "Windows runs build and unit tests; race detection remains on Linux and macOS where the repository validates it reliably."

  integration:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration_tests == 'true'
    needs:
      - build
      - platform
    runs-on: ubuntu-latest
    environment: AUTH_TOKEN
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          check-latest: true
          cache: true
      - name: Test live Splunk integration
        env:
          SPLUNKBASEURL: ${{ secrets.SPLUNKBASEURL }}
          SPLUNKUSERNAME: ${{ secrets.SPLUNKUSERNAME }}
          SPLUNKPASSWORD: ${{ secrets.SPLUNKPASSWORD }}
          SPLUNKTOKEN: ${{ secrets.SPLUNKTOKEN }}
          SPLUNKTLSVERIFY: ${{ secrets.SPLUNKTLSVERIFY }}
          SPLUNKTIMEOUT: ${{ secrets.SPLUNKTIMEOUT }}
          SPLUNKAPP: ${{ secrets.SPLUNKAPP }}
          SPLUNK_INTEGRATION_QUERY: ${{ secrets.SPLUNK_INTEGRATION_QUERY }}
        run: go test -v -tags integration ./splunk
      - name: Test live YAML config integration
        env:
          SPLUNKBASEURL: ${{ secrets.SPLUNKBASEURL }}
          SPLUNKUSERNAME: ${{ secrets.SPLUNKUSERNAME }}
          SPLUNKPASSWORD: ${{ secrets.SPLUNKPASSWORD }}
          SPLUNKTOKEN: ${{ secrets.SPLUNKTOKEN }}
          SPLUNKTLSVERIFY: ${{ secrets.SPLUNKTLSVERIFY }}
          SPLUNKTIMEOUT: ${{ secrets.SPLUNKTIMEOUT }}
          SPLUNKAPP: ${{ secrets.SPLUNKAPP }}
        run: go test -v -tags integration ./...
