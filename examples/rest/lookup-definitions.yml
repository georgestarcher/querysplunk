app: search
output_file: lookup-definitions.json
mode: job
search: |
  | rest /servicesNS/-/search/data/transforms/lookups count=2 strict=true splunk_server=local search="title=example_lookup"
  | table title, filename, collection, external_type, eai:appName, eai:userName
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
