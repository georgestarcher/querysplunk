schema_version: "1"
metadata:
  title: Search concurrency
  description: Report Splunk search-concurrency health indicators.
  category: health
  status: stable
  version: 1
  author: querysplunk contributors
  severity: medium
  tags:
  - search
  - concurrency
  - capacity
  id: querysplunk.health.search-concurrency
requirements:
  platforms:
  - splunk-cloud
  - splunk-enterprise
  fields:
  - name
  - status
  - message
provenance:
  source: querysplunk
  source_url: https://github.com/georgestarcher/querysplunk
  source_rule_ids: []
  license: MIT
interpretation:
  summary: Rows report search-concurrency health indicators exposed by Splunk.
  false_positives:
  - Brief workload bursts can trigger warnings without sustained user impact.
  recommended_actions:
  - Review concurrent workloads, scheduler pressure, search quotas, and workload-management
    settings.

result_handling:
  classification: internal
  contains_credentials: false
  agent_display: bounded_summary
  recommended_file_mode: "0600"
  retention: temporary
result_contract:
  required_fields:
  - title
  - active_hist_searches
  - active_realtime_searches
  - total_hist_searches
  - total_realtime_searches
  allow_empty: true
  maximum_rows: 200

app: search
output_file: search-concurrency.json
mode: job
search: |
  | rest /services/server/status/limits/search-concurrency
  | table title, active_hist_searches, active_realtime_searches, total_hist_searches, total_realtime_searches
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
