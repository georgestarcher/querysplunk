schema_version: "1"
metadata:
  title: Lookup definitions
  description: Inspect lookup definitions and their app and ownership context.
  category: rest
  status: stable
  version: 1
  author: querysplunk contributors
  severity: informational
  tags:
  - lookup
  - knowledge-object
  - rest
  id: querysplunk.rest.lookup-definitions
requirements:
  platforms:
  - splunk-cloud
  - splunk-enterprise
  fields:
  - title
  - filename
  - app
  - owner
  - sharing
provenance:
  source: querysplunk
  source_url: https://github.com/georgestarcher/querysplunk
  source_rule_ids: []
  license: MIT
interpretation:
  summary: Rows describe matching lookup definitions and namespace context.
  false_positives:
  - Multiple definitions with the same title can be valid across apps or sharing scopes.
  recommended_actions:
  - Use app, owner, and sharing fields to select the intended definition before inspecting
    lookup contents.

app: search
output_file: lookup-definitions.json
mode: job
search: |
  | rest /servicesNS/-/search/data/transforms/lookups count=2 strict=true splunk_server=local search="title=example_lookup"
  | table title, filename, collection, external_type, eai:appName, eai:userName
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
