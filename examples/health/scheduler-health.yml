app: search
output_file: scheduler-health.json
mode: job
search: |
  search index=_internal earliest=-24h sourcetype=scheduler
  | stats count by status savedsearch_name app user
  | sort - count
dispatch:
  earliest_time: "-24h"
  latest_time: "now"
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
