schema_version: "1"
metadata:
  title: Internal errors and warnings
  description: Summarize recent warning and error events from Splunk internal logs.
  category: health
  status: stable
  version: 1
  author: querysplunk contributors
  severity: medium
  tags:
  - internal
  - errors
  - warnings
  id: querysplunk.health.internal-errors-warnings
requirements:
  platforms:
  - splunk-cloud
  - splunk-enterprise
  indexes:
  - _internal
  fields:
  - component
  - log_level
  - message
provenance:
  source: querysplunk
  source_url: https://github.com/georgestarcher/querysplunk
  source_rule_ids: []
  license: MIT
interpretation:
  summary: Rows summarize recent internal warning and error messages by component.
  false_positives:
  - Known transient startup, peer, or maintenance messages can be operationally benign.
  recommended_actions:
  - Prioritize recurring components and messages, correlate with deployment changes,
    and inspect detailed logs when needed.

result_handling:
  classification: internal
  contains_credentials: false
  agent_display: bounded_summary
  recommended_file_mode: "0600"
  retention: temporary
result_contract:
  required_fields: []
  allow_empty: true
  maximum_rows: 200

app: search
output_file: internal-errors-warnings.json
mode: job
search: |
  search index=_internal earliest=-1h (log_level=error OR log_level=warn*)
  | stats count, min(_time) AS first_seen_epoch, max(_time) AS last_seen_epoch, latest(_raw) AS latest_message BY host, source, sourcetype, log_level, component
  | sort - count
  | head 200
dispatch:
  earliest_time: "-1h"
  latest_time: "now"
results:
  endpoint: auto
  output_mode: json
  count: 0
diagnostics:
  search_log: summary
